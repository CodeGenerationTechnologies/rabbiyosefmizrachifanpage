name: Deploy to rabbiyosefmizrachifanpage.com

on:
  push:
    branches: ["main"]
  schedule:
    # Daily automated video feed update and redeployment at 03:00 UTC (Cost: $0.00 / 100% Free)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  daily-sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run secure daily video feed updater
        run: npm run update-feed

      - name: Commit and push updated video feed (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/videos_feed.json
          git diff --staged --quiet || (git commit -m "chore(feed): daily update of latest and most popular lectures" && git push)

      - name: Build production bundle with Vite
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to Custom Domain (rabbiyosefmizrachifanpage.com)
        id: deployment
        uses: actions/deploy-pages@v4
